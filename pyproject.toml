[project]
name = "k8s"
version = "0.4.1"
description = "Offline k8s lab (AlmaLinux 10 + containerd + Cilium) on Incus VMs"
readme = "README.md"
authors = [
    { name = "pzzxqj", email = "bsrk_ri@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyinfra>=3.10.0",
    "httpx>=0.27.0",
    "packaging>=24.0",
    "kubernetes>=36.0.3",
]

# Script collection, not an installable package: uv manages the venv deps but
# does not build/install the project itself.
[tool.uv]
package = false

# Extend ruff's default rules (E4/E7/E9/F) with imports (I), implicit string
# concat (ISC) and RUF. Note: ruff's E402 exempts `sys.path` modifications, so
# the deploy/* bootstrap (imports after sys.path.insert) needs no `# noqa`.
[tool.ruff.lint]
extend-select = ["I", "ISC", "RUF"]
